# Release build: desktop installers on per-OS runners, the Linux agent .deb/.rpm, the agent and server images, and
# SHA256SUMS over everything. Runs on a version tag (vX.Y.Z) or by hand (Actions -> release -> Run workflow).
#
# Signing is optional and driven by repository secrets; without them the job still builds, unsigned, with a warning:
#   macOS  : CSC_LINK (base64 .p12 "Developer ID Application" cert), CSC_KEY_PASSWORD
#            notarization: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (needs the cert above)
#   Windows: WIN_CSC_LINK (base64 .pfx Authenticode cert), WIN_CSC_KEY_PASSWORD
#   Images : REGISTRY (e.g. registry.example.com/acme), REGISTRY_USERNAME, REGISTRY_PASSWORD -> push
#   Sums   : GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE -> SHA256SUMS.asc
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (semver, no leading v). Default: <agent VERSION>-ci.<run number>"
        required: false
        default: ""
      push_images:
        description: "Push images when the REGISTRY secrets are set (tag builds always push)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          base=$(sed -nE 's/^VERSION = "([^"]+)"/\1/p' agent/pdp_agent/agent.py)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
          elif [ -n "$INPUT_VERSION" ]; then
            v=${INPUT_VERSION#v}
          else
            v="$base-ci.$GITHUB_RUN_NUMBER"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version '$v' is not semver (X.Y.Z or X.Y.Z-pre)"; exit 1
          fi
          if [ "${v%%-*}" != "$base" ]; then
            echo "::warning::version $v differs from VERSION=$base in agent/pdp_agent/agent.py (the agent reports that one in heartbeats)"
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "prerelease=$pre" >>"$GITHUB_OUTPUT"
          echo "### PDP $v" >>"$GITHUB_STEP_SUMMARY"

  tests:
    uses: ./.github/workflows/tests.yml

  desktop:
    name: desktop (${{ matrix.name }})
    needs: [meta, tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest, target: --mac }
          - { name: windows, os: windows-latest, target: --win }
          - { name: linux, os: ubuntu-latest, target: --linux }
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: CA-pin self-test
        run: npm test
      - name: Set the app version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Signing configuration. Secrets cannot be tested in `if:`, so this step reads them from env and exports only
      # what is present; electron-builder signs when CSC_LINK is set and skips signing otherwise.
      - name: Configure code signing
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          put() {  # name value -> $GITHUB_ENV (heredoc form: safe for multi-line values; values stay masked)
            local d="EOF_$RANDOM$RANDOM"
            { echo "$1<<$d"; printf '%s\n' "$2"; echo "$d"; } >>"$GITHUB_ENV"
          }
          case "$RUNNER_OS" in
            macOS)
              if [ -n "$MAC_CSC_LINK" ]; then
                put CSC_LINK "$MAC_CSC_LINK"; put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
                echo "SIGNED=true" >>"$GITHUB_ENV"
                if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                  put APPLE_ID "$APPLE_ID"; put APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"; put APPLE_TEAM_ID "$APPLE_TEAM_ID"
                  echo "NOTARIZED=true" >>"$GITHUB_ENV"
                else
                  echo "::warning title=macOS not notarized::APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID not set: signed but not notarized (Gatekeeper will warn)"
                fi
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >>"$GITHUB_ENV"
                echo "::warning title=macOS unsigned::CSC_LINK not set: building an unsigned, un-notarized app (users must right-click > Open or run xattr -dr com.apple.quarantine)"
              fi ;;
            Windows)
              if [ -n "$WIN_CSC_LINK" ]; then
                put CSC_LINK "$WIN_CSC_LINK"; put CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
                echo "SIGNED=true" >>"$GITHUB_ENV"
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >>"$GITHUB_ENV"
                echo "::warning title=Windows unsigned::WIN_CSC_LINK not set: building an unsigned installer (SmartScreen will warn)"
              fi ;;
            Linux)
              echo "Linux AppImage/deb are not code-signed; integrity comes from SHA256SUMS (optionally GPG-signed)" ;;
          esac

      - name: Build installers (electron-builder ${{ matrix.target }})
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Verify macOS signature / notarization
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "${NOTARIZED:-}" = true ]; then xcrun stapler validate "$app"; spctl --assess --type execute -vv "$app"; fi
          done
      - name: Verify Authenticode signature
        if: runner.os == 'Windows' && env.SIGNED == 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            Write-Output "$($_.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "signature of $($_.Name) is $($s.Status)" }
          }
      - name: Inspect Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'opt/PDP Console/(pdp-console|resources/app.asar)$|\.desktop$'

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  agent-package:
    name: agent .deb / .rpm
    needs: [meta, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Build (nfpm; packages deploy/systemd/pdp-agent.service as it is in this commit)
        env:
          PDP_VERSION: ${{ needs.meta.outputs.version }}
          PDP_REGISTRY: ${{ secrets.REGISTRY }}
        run: bash deploy/packaging/agent/build.sh
      - name: lintian
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lintian >/dev/null
          lintian --pedantic --fail-on error,warning dist/agent/*.deb
      - name: Install test (throwaway ubuntu:24.04 container; no systemd there)
        run: |
          docker run --rm -v "$PWD/dist/agent:/pkgs:ro" ubuntu:24.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq /pkgs/*.deb >/dev/null
            dpkg -L pdp-agent
            test -f /usr/lib/systemd/system/pdp-agent.service
            test -d /etc/pdp && test -d /var/lib/pdp
            pdp-agent-install --version
            pdp-agent-install --server https://pdp.example.com --ca-sha256 "$(printf "ab%.0s" $(seq 32))" \
              --token t --no-verify --no-start
            test "$(stat -c %a /etc/pdp/agent.env)" = 600
            apt-get purge -y -qq pdp-agent >/dev/null
            test ! -e /etc/pdp/agent.env'
      - uses: actions/upload-artifact@v6
        with:
          name: agent-packages
          if-no-files-found: error
          path: |
            dist/agent/*.deb
            dist/agent/*.rpm

  images:
    name: image (${{ matrix.image }})
    needs: [meta, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [agent, server]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE: pdp/${{ matrix.image }}
    steps:
      - name: Free disk space (the server image is built on a ~8 GB CUDA PyTorch base)
        if: matrix.image == 'server'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v6
      - name: Registry
        id: reg
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          WANT_PUSH: ${{ github.ref_type == 'tag' || inputs.push_images }}
        run: |
          if [ -n "$REGISTRY" ] && [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ] && [ "$WANT_PUSH" = true ]; then
            printf '%s' "$REGISTRY_PASSWORD" | docker login "${REGISTRY%%/*}" -u "$REGISTRY_USERNAME" --password-stdin
            echo "push=true" >>"$GITHUB_OUTPUT"
            echo "REMOTE=${REGISTRY%/}/$IMAGE" >>"$GITHUB_ENV"
          else
            echo "push=false" >>"$GITHUB_OUTPUT"
            [ -n "$REGISTRY" ] || echo "::notice::REGISTRY secrets not set: building $IMAGE without pushing"
          fi
      - name: Build ${{ env.IMAGE }}:${{ env.VERSION }}
        run: |
          docker build -f deploy/docker/${{ matrix.image }}.Dockerfile -t "$IMAGE:$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          docker image ls "$IMAGE"
      - name: Smoke test
        run: |
          if [ "${{ matrix.image }}" = agent ]; then
            docker run --rm --entrypoint python "$IMAGE:$VERSION" -c "import torch, torch_geometric, bcc, pdp_agent.agent as a; print('agent', a.VERSION, torch.__version__)"
          else
            docker run --rm --entrypoint python "$IMAGE:$VERSION" -c "import torch, torch_geometric, fastapi, pdp_server; print('server ok', torch.__version__)"
          fi
      - name: Push
        if: steps.reg.outputs.push == 'true'
        env:
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          docker tag "$IMAGE:$VERSION" "$REMOTE:$VERSION"
          docker push "$REMOTE:$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$PRERELEASE" = false ]; then
            docker tag "$IMAGE:$VERSION" "$REMOTE:latest" && docker push "$REMOTE:latest"
          fi
          echo "pushed $REMOTE:$VERSION" >>"$GITHUB_STEP_SUMMARY"
      - name: Save the agent image for air-gapped installs (pdp-agent-install --image-tar)
        if: matrix.image == 'agent'
        run: |
          refs="$IMAGE:$VERSION"; [ -n "${REMOTE:-}" ] && refs="$refs $REMOTE:$VERSION"
          # shellcheck disable=SC2086
          docker save $refs | gzip -6 >"pdp-agent-image-$VERSION.tar.gz"
          ls -l pdp-agent-image-*.tar.gz
      - uses: actions/upload-artifact@v6
        if: matrix.image == 'agent'
        with:
          name: agent-image
          path: pdp-agent-image-*.tar.gz
          if-no-files-found: error
          compression-level: 0   # already gzipped
          retention-days: 14

  release:
    name: SHA256SUMS (+ draft GitHub release on tags)
    needs: [meta, desktop, agent-package, images]
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # gh release create (tag builds only)
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd release
          ls -l
          [ -n "$(ls -A)" ] || { echo "::error::no artifacts were produced"; exit 1; }
          sha256sum -- * | tee SHA256SUMS
      - name: GPG-sign SHA256SUMS (when GPG_PRIVATE_KEY is set)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "::notice::GPG_PRIVATE_KEY not set: SHA256SUMS is not signed"; exit 0; fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output release/SHA256SUMS.asc release/SHA256SUMS
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS*
      - name: Job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::warning::not all builds succeeded ($bad): SHA256SUMS covers only the artifacts that were produced; no release is created"
            echo "INCOMPLETE=true" >>"$GITHUB_ENV"
          fi
      - name: Draft GitHub release (tag builds with every job green)
        if: github.ref_type == 'tag' && env.INCOMPLETE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags="--draft"; [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "PDP $VERSION" $flags \
            --notes "Desktop installers, agent .deb/.rpm and agent image archive for PDP $VERSION. Verify downloads with SHA256SUMS."
