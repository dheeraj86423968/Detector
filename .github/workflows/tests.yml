# Unit tests: on every push / pull request, and as the first stage of release.yml (workflow_call).
# The unit tests are plain Python scripts (tests/unit/test_*.py) that exit non-zero on failure; tests/run_unit.sh runs
# them inside the server image (all) and the slim agent image (agent-side), like on a developer machine. No kernel,
# running server or database is needed. End-to-end suites run against a staging stack (deploy/staging.sh,
# tests/run_e2e.sh).
name: tests

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (in the server and agent images)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build the server and agent images (as deploy/bringup.sh does)
        run: |
          docker build -q -f deploy/docker/server.Dockerfile -t pdp/server:ci .
          docker build -q -f deploy/docker/agent.Dockerfile -t pdp/agent:ci .
      - name: tests/run_unit.sh
        run: tests/run_unit.sh pdp/server:ci pdp/agent:ci

  agent-arm64:
    name: agent image on arm64 (native build, agent-side tests, eBPF load on a real arm64 kernel)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build the agent image natively (vmlinux.h from the runner's arm64 BTF)
        run: docker build -q -f deploy/docker/agent.Dockerfile -t pdp/agent:ci-arm64 .
      - name: Agent-side unit tests in the arm64 image
        run: |
          for t in test_agent test_footprint test_nobtf test_ebpf; do
            docker run --rm -v "$PWD":/src -w /src -e PYTHONPATH=/src/engine:/src/agent --entrypoint python pdp/agent:ci-arm64 tests/unit/$t.py
          done
      - name: The CO-RE collector loads and attaches on the arm64 kernel (kernel BTF, then the same BTF as a file)
        run: |
          docker run --rm --privileged --pid=host --entrypoint /opt/pdp/bin/pdp-ebpf pdp/agent:ci-arm64 --check
          docker run --rm --privileged --pid=host -v /sys/kernel/btf/vmlinux:/b/k.btf:ro --entrypoint /opt/pdp/bin/pdp-ebpf pdp/agent:ci-arm64 --btf /b/k.btf --check

  desktop-pin:
    name: desktop CA-pin self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      # pin.js has no dependencies: the self-test runs without npm install
      - run: node desktop/scripts/pin-selftest.js

  packaging-lint:
    name: shellcheck packaging scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck (preinstalled on ubuntu runners)
        run: |
          shellcheck -s sh deploy/packaging/agent/deb/* deploy/packaging/agent/rpm/*
          shellcheck deploy/packaging/agent/pdp-agent-install deploy/packaging/agent/build.sh
