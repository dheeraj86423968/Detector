# Overlay: benchmark endpoints that replay a DARPA TC database through the real agent path (enrol, upload, bundle,
# local detection, report). The research Postgres container must be reachable on the external `shared_network`.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml -f deploy/docker-compose.research.yml \
#     --env-file deploy/.env up -d agent-bench
# Benchmark containers are the kernel's first choice when the host runs out of memory (not production's agent or
# databases), and each has a memory cap; on 2026-11-05 three replay agents plus an evaluation pushed the shared L40S
# host into the OOM killer, which picked the host's own production agent (the largest process).
x-bench-limits: &bench-limits
  oom_score_adj: 800
  mem_limit: ${PDP_BENCH_MEM:-12g}

services:
  worker-train:              # held-out days for simulation campaigns are replayed from the research database
    networks: [ backend, research ]
  agent-bench:
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["agent", "run"]
    environment:
      PDP_AGENT_CONFIG: /etc/pdp/agent.json
    volumes:
      - pdp_bench_agent:/var/lib/pdp
      - ./bench/agent.json:/etc/pdp/agent.json:ro
    networks: [ edge, research ]
    depends_on: [ gateway ]
    <<: *bench-limits
    deploy:                  # benchmark endpoints detect on the GPU (bench/agent.json "device": "cuda")
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  agent-bench-theia:         # second benchmark endpoint (THEIA E3); both fit together on the 46 GB L40S
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["agent", "run"]
    environment:
      PDP_AGENT_CONFIG: /etc/pdp/agent.json
    volumes:
      - pdp_bench_agent_theia:/var/lib/pdp
      - ./bench/agent-theia.json:/etc/pdp/agent.json:ro
    networks: [ edge, research ]
    depends_on: [ gateway ]
    <<: *bench-limits
    deploy:
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  agent-bench-clearscope-e3:   # DARPA E3 ClearScope (Android; 0.6 held-out, docs/BENCHMARK_HELDOUT.md)
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["agent", "run"]
    environment:
      PDP_AGENT_CONFIG: /etc/pdp/agent.json
    volumes:
      - pdp_bench_agent_clearscope_e3:/var/lib/pdp
      - ./bench/agent-clearscope-e3.json:/etc/pdp/agent.json:ro
    networks: [ edge, research ]
    depends_on: [ gateway ]
    <<: *bench-limits
    deploy:
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  agent-bench-fivedirections-e3:   # DARPA E3 FiveDirections (Windows; 0.6 held-out, docs/BENCHMARK_HELDOUT.md)
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["agent", "run"]
    environment:
      PDP_AGENT_CONFIG: /etc/pdp/agent.json
    volumes:
      - pdp_bench_agent_fivedirections_e3:/var/lib/pdp
      - ./bench/agent-fivedirections-e3.json:/etc/pdp/agent.json:ro
    networks: [ edge, research ]
    depends_on: [ gateway ]
    <<: *bench-limits
    deploy:
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  agent-bench-optc-h201:      # DARPA OpTC host 201 (Windows; docs/BENCHMARK_OPTC.md)
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["agent", "run"]
    environment:
      PDP_AGENT_CONFIG: /etc/pdp/agent.json
    volumes:
      - pdp_bench_agent_optc_h201:/var/lib/pdp
      - ./bench/agent-optc-h201.json:/etc/pdp/agent.json:ro
    networks: [ edge, research ]
    depends_on: [ gateway ]
    <<: *bench-limits
    deploy:
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  agent-bench-optc-h501:      # DARPA OpTC host 501 (Windows; docs/BENCHMARK_OPTC.md)
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["agent", "run"]
    environment:
      PDP_AGENT_CONFIG: /etc/pdp/agent.json
    volumes:
      - pdp_bench_agent_optc_h501:/var/lib/pdp
      - ./bench/agent-optc-h501.json:/etc/pdp/agent.json:ro
    networks: [ edge, research ]
    depends_on: [ gateway ]
    <<: *bench-limits
    deploy:
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  agent-bench-optc-h051:      # DARPA OpTC host 051 (Windows; docs/BENCHMARK_OPTC.md)
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["agent", "run"]
    environment:
      PDP_AGENT_CONFIG: /etc/pdp/agent.json
    volumes:
      - pdp_bench_agent_optc_h051:/var/lib/pdp
      - ./bench/agent-optc-h051.json:/etc/pdp/agent.json:ro
    networks: [ edge, research ]
    depends_on: [ gateway ]
    <<: *bench-limits
    deploy:
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

  bench-eval:                # one-off evaluations, one at a time, on the GPU:
    #   docker compose ... run --rm bench-eval python -m pdp_server.tools.darpa_eval --endpoint ID --dataset D --json /out/x.json
    image: pdp/server:${PDP_VERSION:-dev}
    profiles: [ eval ]
    environment:
      PDP_DB_PASSWORD: ${PDP_DB_PASSWORD:?set PDP_DB_PASSWORD}
      PDP_KMS: ${PDP_KMS:-file}
      PDP_KMS_ADDR: ${PDP_KMS_ADDR:-http://kms:8200}
      PDP_GT_DIR: /gt/orthrus
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    shm_size: 8g
    volumes:
      - pdp_data:/data
      - pdp_pki:/pki
      - "${PDP_KMS_SECRETS:-./kms-secrets}/token:/run/pdp-kms:ro"
      - "${PDP_GT_HOST_DIR:-/root/PIDSMaker/Ground_Truth/orthrus}:/gt/orthrus:ro"
      - ../artifacts:/out
    networks: [ backend, research ]
    oom_score_adj: 800
    mem_limit: ${PDP_EVAL_MEM:-20g}
    deploy:
      resources:
        reservations:
          devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ]

networks:
  research:
    external: true
    name: shared_network

volumes:
  pdp_bench_agent: {}
  pdp_bench_agent_theia: {}
  pdp_bench_agent_optc_h201: {}
  pdp_bench_agent_optc_h501: {}
  pdp_bench_agent_optc_h051: {}
  pdp_bench_agent_clearscope_e3: {}
  pdp_bench_agent_fivedirections_e3: {}
