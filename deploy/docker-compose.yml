name: pdp
# Server stack. Bring up with ./deploy/bringup.sh (generates PDP_DB_PASSWORD into deploy/.env on first run).
x-db-env: &db-env
  PDP_DB_PASSWORD: ${PDP_DB_PASSWORD:?set PDP_DB_PASSWORD in deploy/.env (deploy/bringup.sh generates one)}
# Key management (docs/DEPLOYMENT.md "Signing keys in a KMS"): PDP_KMS=transit keeps the CA and bundle-signing keys in
# the KMS (bundled OpenBao, compose profile "kms", or an external Vault/OpenBao via PDP_KMS_ADDR).
x-kms-env: &kms-env
  PDP_KMS: ${PDP_KMS:-file}
  PDP_KMS_ADDR: ${PDP_KMS_ADDR:-http://kms:8200}
  PDP_KMS_CACERT: ${PDP_KMS_CACERT:-}
  PDP_KMS_NAMESPACE: ${PDP_KMS_NAMESPACE:-}

services:
  platform-db:
    image: postgres:17
    oom_score_adj: -500        # the kernel's last choice when memory runs out (losing a database stops everything)
    environment: { POSTGRES_USER: pdp, POSTGRES_PASSWORD: "${PDP_DB_PASSWORD:?set PDP_DB_PASSWORD}", POSTGRES_DB: platform }
    volumes: [ pdp_platform_db:/var/lib/postgresql/data ]
    networks: [ backend ]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pdp -d platform"], interval: 5s, timeout: 5s, retries: 10 }

  telemetry-db:
    image: postgres:17
    oom_score_adj: -500        # the kernel's last choice when memory runs out (losing a database stops everything)
    environment: { POSTGRES_USER: pdp, POSTGRES_PASSWORD: "${PDP_DB_PASSWORD:?set PDP_DB_PASSWORD}", POSTGRES_DB: telemetry }
    command: ["postgres", "-c", "shared_buffers=${PDP_TELEMETRY_SHARED_BUFFERS:-4GB}", "-c", "max_wal_size=8GB", "-c", "work_mem=64MB",
              "-c", "maintenance_work_mem=1GB", "-c", "effective_cache_size=16GB", "-c", "synchronous_commit=off"]
    shm_size: 4g
    volumes: [ pdp_telemetry_db:/var/lib/postgresql/data ]
    networks: [ backend ]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pdp -d telemetry"], interval: 5s, timeout: 5s, retries: 10 }

  api:
    image: pdp/server:${PDP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/docker/server.Dockerfile }
    # two replicas so that updates roll one at a time without downtime (deploy/rollout.sh); nginx spreads requests
    # over both through Docker DNS and retries a request on the other replica when one is going away
    scale: ${PDP_API_REPLICAS:-2}
    stop_grace_period: 30s
    environment:
      <<: [*db-env, *kms-env]
      PDP_HOSTNAMES: ${PDP_HOSTNAMES:-localhost,gateway}
      PDP_API_WORKERS: ${PDP_API_WORKERS:-4}
      PDP_CONSOLE_PORT: ${PDP_CONSOLE_PORT:-443}         # for the install commands shown in the console
      PDP_AGENT_PORT: ${PDP_AGENT_PORT:-8443}
      PDP_AGENT_IMAGE: ${PDP_AGENT_IMAGE:-pdp/agent:latest}
      # single sign-on (docs/DEPLOYMENT.md "Single sign-on"); the IdP is reached through the egress service
      PDP_OIDC_ISSUER: ${PDP_OIDC_ISSUER:-}
      PDP_OIDC_CLIENT_ID: ${PDP_OIDC_CLIENT_ID:-}
      PDP_OIDC_CLIENT_SECRET: ${PDP_OIDC_CLIENT_SECRET:-}
      PDP_OIDC_REDIRECT_URL: ${PDP_OIDC_REDIRECT_URL:-}
      PDP_OIDC_SCOPES: ${PDP_OIDC_SCOPES:-openid profile email}
      PDP_OIDC_GROUPS_CLAIM: ${PDP_OIDC_GROUPS_CLAIM:-groups}
      PDP_OIDC_USERNAME_CLAIM: ${PDP_OIDC_USERNAME_CLAIM:-preferred_username}
      PDP_OIDC_ADMIN_GROUPS: ${PDP_OIDC_ADMIN_GROUPS:-}
      PDP_OIDC_ANALYST_GROUPS: ${PDP_OIDC_ANALYST_GROUPS:-}
      PDP_OIDC_VIEWER_GROUPS: ${PDP_OIDC_VIEWER_GROUPS:-}
      PDP_OIDC_DEFAULT_ROLE: ${PDP_OIDC_DEFAULT_ROLE:-none}
      PDP_OIDC_LABEL: ${PDP_OIDC_LABEL:-Sign in with SSO}
      PDP_PASSWORD_LOGIN: ${PDP_PASSWORD_LOGIN:-enabled}
      # hosted multi-tenant: client self sign-up (off | code | open), endpoint limit per new organisation
      PDP_NOTIFY_ALLOW_PRIVATE: ${PDP_NOTIFY_ALLOW_PRIVATE:-0}
      PDP_INITIAL_ADMIN_PASSWORD: ${PDP_INITIAL_ADMIN_PASSWORD:-}   # first start only (staging); else generated
      PDP_SIGNUP: ${PDP_SIGNUP:-off}
      PDP_SIGNUP_CODE: ${PDP_SIGNUP_CODE:-}
      PDP_ORG_MAX_ENDPOINTS: ${PDP_ORG_MAX_ENDPOINTS:-25}
      PDP_INTERNAL_ORG_NAME: ${PDP_INTERNAL_ORG_NAME:-Internal}
      PDP_SIGNUPS_PER_HOUR: ${PDP_SIGNUPS_PER_HOUR:-5}
      PDP_AGENT_VERSION: ${PDP_AGENT_VERSION:-}            # the published agent the one-line installer pulls (deploy/publish-agent.sh)
      PDP_AGENT_DIGEST: ${PDP_AGENT_DIGEST:-}              # ... and its manifest digest: installs and updates pull by digest, never by tag alone
      PDP_AGENT_DIGESTS: ${PDP_AGENT_DIGESTS:-}            # "ver=sha256:...,..." for every version published since digests were recorded
      PDP_INGEST_DAILY_BYTES: ${PDP_INGEST_DAILY_BYTES:-}  # per-endpoint upload budget per 24 h (default 8 GiB / 200 M rows)
      PDP_INGEST_DAILY_ROWS: ${PDP_INGEST_DAILY_ROWS:-}
      PDP_PUBLIC_HOSTNAME: ${PDP_PUBLIC_HOSTNAME:-}
      HTTPS_PROXY: ${PDP_HTTPS_PROXY:-}
      NO_PROXY: ${PDP_NO_PROXY:-kms,localhost,127.0.0.1}
      PDP_DOH_URL: ${PDP_DOH_URL:-https://cloudflare-dns.com/dns-query}   # SSO domain proof (DNS TXT over HTTPS)
    volumes: [ pdp_data:/data, pdp_pki:/pki, pdp_pki_private:/pki/private, "${PDP_KMS_SECRETS:-./kms-secrets}/token:/run/pdp-kms:ro",
               "./btf:/btf:ro" ]          # BTF files for endpoint kernels without their own (operator-stocked; may be empty)
    networks: [ backend ]
    restart: unless-stopped
    depends_on:
      platform-db: { condition: service_healthy }
      telemetry-db: { condition: service_healthy }
      kms: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  worker-ingest:
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["worker", "--kinds", "ingest,train_rules"]
    # train_rules signs the early rules-only bundles: it needs the KMS like worker-train (without it every early
    # model failed with "/pki/bundle_signing.key not found" when PDP_KMS=transit)
    environment: { <<: [*db-env, *kms-env] }
    volumes: [ pdp_data:/data, pdp_pki:/pki, pdp_pki_private:/pki/private, "${PDP_KMS_SECRETS:-./kms-secrets}/token:/run/pdp-kms:ro" ]
    networks: [ backend ]
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }

  worker-train:
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["worker", "--kinds", "train,sim", "--device", "${PDP_TRAIN_DEVICE:-cpu}"]
    environment: { <<: [*db-env, *kms-env] }
    shm_size: 8g
    volumes: [ pdp_data:/data, pdp_pki:/pki, pdp_pki_private:/pki/private, "${PDP_KMS_SECRETS:-./kms-secrets}/token:/run/pdp-kms:ro" ]
    networks: [ backend ]
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }

  gateway:
    image: nginx:1.27-alpine
    # PDP_BIND: empty = all addresses (production: clients need the console and agent ports); "127.0.0.1:" = this
    # host only (staging: reach it through an SSH tunnel)
    ports: [ "${PDP_BIND:-}${PDP_HTTP_PORT:-80}:80", "${PDP_BIND:-}${PDP_CONSOLE_PORT:-443}:443", "${PDP_BIND:-}${PDP_AGENT_PORT:-8443}:8443",
             "127.0.0.1:${PDP_REGISTRY_PUSH_PORT:-5000}:5000" ]   # registry pushes (deploy/publish-agent.sh): loopback, HTTP basic auth
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/console.conf:/etc/nginx/snippets/console.conf:ro
      - ${PDP_REGISTRY_HTPASSWD:-./nginx/registry-push.htpasswd}:/etc/nginx/registry-push.htpasswd:ro   # written by bringup.sh / staging.sh
      - ${PDP_NGINX_PUBLIC:-./nginx/public}:/etc/nginx/public:ro   # public-hostname server, written by deploy/acme.sh
      - pdp_acme:/etc/letsencrypt:ro
      - pdp_acme_web:/acme:ro
      - pdp_pki:/pki:ro
      - ${PDP_CONSOLE_DIST:-../console/dist}:/console:ro   # staging: ../console/dist-next (built ahead of production)
    networks: [ backend, edge ]
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }

  registry:                  # agent image distribution: clients pull through the gateway (read-only, enrolment token)
    image: registry:2.8.3
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      # read-only except while deploy/publish-agent.sh runs (it recreates the registry writable for the push and
      # read-only again afterwards): nothing on the backend network can re-point a published tag (security review F2)
      # (the whole maintenance section as YAML: registry 2.8 panics on REGISTRY_STORAGE_MAINTENANCE_READONLY_ENABLED alone -
      # "readonly config key must contain additional keys"; verified: read-only answers an upload with 405)
      REGISTRY_STORAGE_MAINTENANCE: "readonly: {enabled: ${PDP_REGISTRY_READONLY:-true}}"
    volumes: [ pdp_registry:/var/lib/registry ]
    # no published port: pushes go through the gateway's loopback listener (basic auth), pulls through /v2/
    networks: [ backend ]
    restart: unless-stopped

  notifier:                  # notifications (e-mail, Slack, Teams, webhook, syslog CEF) and SIEM alert feeds per
    image: pdp/server:${PDP_VERSION:-dev}   # organisation; the only backend service with internet access
    command: ["notifier"]
    environment:
      <<: *db-env
      PDP_SMTP_URL: ${PDP_SMTP_URL:-}                     # smtp://user:pass@relay:587 (STARTTLS) | smtps://...:465
      PDP_SMTP_FROM: ${PDP_SMTP_FROM:-}
      PDP_PUBLIC_HOSTNAME: ${PDP_PUBLIC_HOSTNAME:-}
      PDP_CONSOLE_URL: ${PDP_CONSOLE_URL:-}
      PDP_NOTIFY_MAX_PER_HOUR: ${PDP_NOTIFY_MAX_PER_HOUR:-20}
      PDP_NOTIFY_OFFLINE_MIN: ${PDP_NOTIFY_OFFLINE_MIN:-10}
      PDP_NOTIFY_ALLOW_PRIVATE: ${PDP_NOTIFY_ALLOW_PRIVATE:-0}   # 1 only on-premises / tests: allow internal targets
      PDP_EXPORT_SYSLOG: ${PDP_EXPORT_SYSLOG:-}           # legacy server-wide SIEM feed -> internal org channel
      PDP_EXPORT_WEBHOOK: ${PDP_EXPORT_WEBHOOK:-}
      PDP_EXPORT_WEBHOOK_TOKEN: ${PDP_EXPORT_WEBHOOK_TOKEN:-}
    networks: [ backend, edge ]
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }

  backup:                    # encrypted backups of the platform database, CA / KMS keys and current models
    image: postgres:17
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      <<: *db-env
      PDP_BACKUP_INTERVAL_H: ${PDP_BACKUP_INTERVAL_H:-24}
      PDP_BACKUP_KEEP: ${PDP_BACKUP_KEEP:-7}
      PDP_BACKUP_FULL: ${PDP_BACKUP_FULL:-0}     # 1: also raw telemetry and training windows (endpoints still learning)
    volumes:
      - ./backup:/backup:ro
      - "${PDP_BACKUP_DIR:-./backups}:/backups"
      - "${PDP_BACKUP_KEY:-./backup.key}:/run/backup.key:ro"     # keep a copy of this key off the host
      - pdp_pki:/pki:ro
      - pdp_pki_private:/pki/private:ro
      - pdp_data:/data:ro
      - pdp_kms_data:/kms-data:ro
      - "${PDP_KMS_SECRETS:-./kms-secrets}:/kms-secrets:ro"
    networks: [ backend ]
    restart: unless-stopped
    depends_on: { platform-db: { condition: service_healthy } }

  prometheus:                # platform monitoring (profile "monitoring"): metrics of every API replica + alert rules
    image: prom/prometheus:v2.54.1
    volumes: [ ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro, pdp_prometheus:/prometheus ]
    networks: [ backend ]
    restart: unless-stopped
    profiles: [ monitoring ]

  grafana:                   # dashboards on 127.0.0.1:3000 only (ssh -L 3000:127.0.0.1:3000 to view)
    image: grafana/grafana:11.2.2
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "false", GF_USERS_ALLOW_SIGN_UP: "false", GF_SECURITY_ADMIN_PASSWORD: "${PDP_GRAFANA_PASSWORD:-change-me}" }
    volumes: [ ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro, ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro, pdp_grafana:/var/lib/grafana ]
    ports: [ "127.0.0.1:${PDP_GRAFANA_PORT:-3000}:3000" ]
    networks: [ backend, edge ]
    restart: unless-stopped
    profiles: [ monitoring ]

  egress:                    # allow-listed CONNECT proxy: the api's only route to the identity provider
    image: pdp/server:${PDP_VERSION:-dev}
    command: ["python", "-m", "pdp_server.egress"]
    environment:
      <<: *db-env                # reads the organisations' own identity providers (orgs.sso) to allow them
      PDP_EGRESS_ALLOW: ${PDP_EGRESS_ALLOW:-}
      PDP_OIDC_ISSUER: ${PDP_OIDC_ISSUER:-}
      PDP_DOH_URL: ${PDP_DOH_URL:-https://cloudflare-dns.com/dns-query}
    networks: [ backend, edge ]
    restart: unless-stopped
    profiles: [ sso ]

  kms:                       # bundled KMS (OpenBao): CA + bundle-signing keys; set up by tools/kms_setup.py
    image: quay.io/openbao/openbao:2.1.0
    entrypoint: ["/bin/sh", "/kms/entrypoint.sh"]
    volumes:
      - ./kms:/kms:ro
      - "${PDP_KMS_SECRETS:-./kms-secrets}/unseal:/run/kms-unseal:ro"    # unseal key: this container only
      - pdp_kms_data:/openbao/file
      - pdp_kms_logs:/openbao/logs                                      # audit log of every signing request
    networks: [ backend ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null 2>&1 || [ ! -s /run/kms-unseal/key ]"]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles: [ kms ]

networks:
  backend: { internal: true }     # no internet egress for api/workers/databases
  edge: {}

volumes:
  pdp_registry: {}
  pdp_platform_db: {}
  pdp_telemetry_db: {}
  pdp_data: {}
  pdp_pki: {}
  pdp_pki_private: {}       # CA key, bundle-signing key (file mode) and the session secret: api and workers only, never the gateway
  pdp_kms_data: {}
  pdp_prometheus: {}
  pdp_grafana: {}
  pdp_acme: {}
  pdp_acme_web: {}
  pdp_kms_logs: {}
