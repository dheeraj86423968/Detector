# Prometheus for the PDP platform (compose profile "monitoring"): scrapes every API replica's /metrics.
global: { scrape_interval: 30s, evaluation_interval: 30s }
rule_files: [ /etc/prometheus/rules.yml ]
scrape_configs:
  - job_name: pdp-api
    dns_sd_configs: [ { names: [ api ], type: A, port: 8000 } ]
