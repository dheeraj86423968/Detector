# Console + enrolment locations, shared by the internal-certificate server and the public-hostname server.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
client_max_body_size 256m;
set $api http://api:8000;

location = /healthz { proxy_pass $api; }
location /v1/enroll { proxy_pass $api; proxy_set_header X-Client-Verify NONE; proxy_set_header X-Client-DN ""; }
location /v1/        { return 403; }
location /api/       { proxy_pass $api; proxy_set_header X-Client-Verify NONE; proxy_set_header X-Client-DN ""; proxy_set_header X-Forwarded-Proto https;
                       proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300; }
# public sign-up and sign-in: per-address request limit in front of the API's own back-off
location = /api/signup { limit_req zone=pdp_signup burst=10 nodelay; limit_req_status 429; proxy_pass $api; proxy_set_header X-Client-Verify NONE;
                       proxy_set_header X-Client-DN ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
# ... the password step and the second-factor step (a 6-digit code must not be guessable at the API's own pace)
location ~ ^/api/login(/mfa)?$ { limit_req zone=pdp_login burst=20 nodelay; limit_req_status 429; proxy_pass $api; proxy_set_header X-Client-Verify NONE;
                       proxy_set_header X-Client-DN ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
location /dl/ca.pem  { alias /pki/ca.pem; }
# one-line agent installer (rendered by the API for this server)
location = /install.sh { proxy_pass $api; proxy_set_header Host $host; proxy_set_header X-Client-Verify NONE; proxy_set_header X-Client-DN ""; }
# agent image registry: pull only, with a valid enrolment token as the password (the API decides)
location /v2/ {
    limit_except GET HEAD { deny all; }
    auth_request /_registry_auth;
    error_page 401 = @registry_401;
    set $registry http://registry:5000;
    proxy_pass $registry;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 900;
    proxy_buffering off;
}
location = /_registry_auth {
    internal;
    proxy_pass $api/api/registry/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
}
location @registry_401 {
    add_header WWW-Authenticate 'Basic realm="PDP agent registry"' always;
    add_header Docker-Distribution-Api-Version registry/2.0 always;
    return 401 '{"errors":[{"code":"UNAUTHORIZED","message":"log in with an enrolment token"}]}';
}
location /assets/    { root /console; add_header Cache-Control "public, max-age=31536000, immutable" always;
                       add_header Strict-Transport-Security "max-age=31536000" always; }
location /           { root /console; try_files $uri /index.html; add_header Cache-Control "no-cache" always;
                       add_header Strict-Transport-Security "max-age=31536000" always;
                       add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'" always;
                       add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "same-origin" always;
                       include /etc/nginx/public/*.redirect; }
