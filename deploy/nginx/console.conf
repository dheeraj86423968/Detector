# Console + enrolment locations, shared by the internal-certificate server and the public-hostname server.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
client_max_body_size 256m;
set $api http://api:8000;

location = /healthz { proxy_pass $api; }
location /v1/enroll { proxy_pass $api; proxy_set_header X-Client-Verify NONE; proxy_set_header X-Client-DN ""; }
location /v1/        { return 403; }
location /api/       { proxy_pass $api; proxy_set_header X-Client-Verify NONE; proxy_set_header X-Client-DN ""; proxy_set_header X-Forwarded-Proto https;
                       proxy_set_header Host $host; proxy_read_timeout 300; }
location /dl/ca.pem  { alias /pki/ca.pem; }
location /assets/    { root /console; add_header Cache-Control "public, max-age=31536000, immutable" always;
                       add_header Strict-Transport-Security "max-age=31536000" always; }
location /           { root /console; try_files $uri /index.html; add_header Cache-Control "no-cache" always;
                       add_header Strict-Transport-Security "max-age=31536000" always;
                       add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'" always;
                       add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "same-origin" always;
                       include /etc/nginx/public/*.redirect; }
