# The API is resolved at request time through Docker's embedded DNS so the gateway survives API restarts
# and starts even when the API container is not up yet.
resolver 127.0.0.11 valid=5s ipv6=off;
# API replicas come and go during rolling updates: a request whose replica refuses or drops the connection, or answers
# 502/503 while stopping, is passed to another replica (never after a non-idempotent request was sent)
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
proxy_connect_timeout 3s;
limit_req_zone $binary_remote_addr zone=pdp_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pdp_signup:10m rate=10r/m;
# agent API: per client certificate (one endpoint). Heartbeats, status polls and uploads of a busy host stay well
# under this; a runaway or hostile agent cannot monopolise the API (security review F11; the API also enforces a
# daily byte / row budget per endpoint)
limit_req_zone $ssl_client_s_dn zone=pdp_agent:10m rate=300r/m;

# Plain HTTP: ACME challenges for the public certificate (deploy/acme.sh), everything else to HTTPS
server {
    listen 80 default_server;
    location /.well-known/acme-challenge/ { root /acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# Console + enrolment with the internal CA's certificate (localhost, gateway, IP access; agents pin this CA).
# Browsers that reach it by IP are redirected to the public hostname when one is configured (*.redirect).
server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /pki/server-chain.pem;     # leaf + CA, so clients that pin the CA find it in the handshake
    ssl_certificate_key /pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/console.conf;
}

# Console on the public hostname with a publicly trusted certificate (generated by deploy/acme.sh)
include /etc/nginx/public/*.conf;

# Registry pushes (deploy/publish-agent.sh): published on 127.0.0.1 only, HTTP basic auth with the credentials
# bringup.sh / staging.sh generate (PDP_REGISTRY_PUSH_USER / PDP_REGISTRY_PUSH_PASSWORD in .env). The registry itself
# has no published port and is read-only except during a publish (security review F2).
server {
    listen 5000;
    client_max_body_size 0;
    set $registry http://registry:5000;
    location /v2/ {
        auth_basic "PDP registry push";
        auth_basic_user_file /etc/nginx/registry-push.htpasswd;
        proxy_pass $registry;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_read_timeout 900;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location / { return 404; }
}

# Agent API: mutual TLS; the verified client CN is forwarded to the API, which re-checks it against the endpoint id
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /pki/server-chain.pem;     # leaf + CA, so clients that pin the CA find it in the handshake
    ssl_certificate_key /pki/server.key;
    ssl_client_certificate /pki/ca.pem;
    # optional so a new agent can enrol here (this port always presents the internal CA it pins); every other
    # agent call still needs a verified client certificate - checked here and again by the API
    ssl_verify_client optional;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512m;
    set $api http://api:8000;

    location = /v1/enroll {
        proxy_pass $api;
        proxy_set_header X-Client-Verify NONE;
        proxy_set_header X-Client-DN "";
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /dl/ca.pem { alias /pki/ca.pem; }
    location = /healthz { proxy_pass $api; }
    location /v1/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        limit_req zone=pdp_agent burst=300 nodelay; limit_req_status 429;
        proxy_pass $api;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600;
    }
    location / { return 404; }
}
