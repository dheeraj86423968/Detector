# The API is resolved at request time through Docker's embedded DNS so the gateway survives API restarts
# and starts even when the API container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

# Console + enrolment: TLS, no client certificate
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /pki/server-chain.pem;     # leaf + CA, so clients that pin the CA find it in the handshake
    ssl_certificate_key /pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    client_max_body_size 256m;
    set $api http://api:8000;

    location = /healthz { proxy_pass $api; }
    location /v1/enroll { proxy_pass $api; proxy_set_header X-Client-Verify NONE; proxy_set_header X-Client-DN ""; }
    location /v1/        { return 403; }
    location /api/       { proxy_pass $api; proxy_set_header X-Client-Verify NONE; proxy_set_header X-Client-DN ""; proxy_set_header X-Forwarded-Proto https;
                           proxy_read_timeout 300; }
    location /dl/ca.pem  { alias /pki/ca.pem; }
    location /           { root /console; try_files $uri /index.html; }
}

# Agent API: mutual TLS; the verified client CN is forwarded to the API, which re-checks it against the endpoint id
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /pki/server-chain.pem;     # leaf + CA, so clients that pin the CA find it in the handshake
    ssl_certificate_key /pki/server.key;
    ssl_client_certificate /pki/ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512m;
    set $api http://api:8000;

    location /v1/ {
        proxy_pass $api;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600;
    }
    location / { return 404; }
}
